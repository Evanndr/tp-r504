name: tests unitaires

on: [push]

jobs:
  test1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: pytest TP1/test.py

  prod-check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nom branche: ${{ github.ref }}"

  env-info:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher les informations d'environnement
        run: |
          echo "Nom de la branche : ${{ github.ref_name }}"
          echo "OS de la machine virtuelle : ${{ runner.os }}"

